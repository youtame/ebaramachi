AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Commuter backend proxy for ODPT API

Parameters:
    OdptConsumerKey:
        Type: String
        NoEcho: true
        Description: Consumer key for ODPT API (acl:consumerKey)

Globals:
    Function:
        Timeout: 20
        MemorySize: 512
        Runtime: python3.12
        LoggingConfig:
            LogFormat: JSON
        Environment:
            Variables:
                ODPT_CONSUMER_KEY: !Ref OdptConsumerKey

Resources:
    OdptProxyFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: hello_world/
            Handler: app.lambda_handler
            Events:
                GetTimetable:
                    Type: Api
                    Properties:
                        Path: /timetable
                        Method: get

Outputs:
    ApiUrl:
        Description: Endpoint URL for ODPT proxy
        Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/timetable"
